<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>场景清单导出</title>
<style>
    body{font-family:'Microsoft YaHei','SimHei',Arial,sans-serif;padding:15px 20px;color:#333;}
    h1{font-size:18px;color:#1e3a5f;border-bottom:2px solid #1a56db;padding-bottom:8px;margin-bottom:4px;}
    .sub{font-size:11px;color:#6b7280;margin-bottom:12px;}
    table{width:100%;border-collapse:collapse;font-size:12px;}
    th{background:#1a56db;color:#fff;padding:8px 10px;text-align:left;font-weight:600;border:1px solid #1e40af;white-space:nowrap;}
    td{padding:8px 10px;border:1px solid #d1d5db;vertical-align:top;}
    tr:nth-child(even) td{background:#f9fafb;}
    .sign-thumbs{display:flex;flex-wrap:wrap;gap:4px;}
    .sign-thumbs img{width:48px;height:48px;object-fit:contain;border:1px solid #e5e7eb;border-radius:3px;background:#fff;}
    .sign-thumbs .no-img{width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:#f3f4f6;border:1px solid #e5e7eb;border-radius:3px;font-size:9px;color:#9ca3af;}
    .tag{display:inline-block;padding:1px 7px;border-radius:9px;font-size:10px;margin:1px 2px;font-weight:500;}
    @media print{
        body{padding:8px 12px;}
        table{font-size:10px;}
        th,td{padding:4px 6px;}
    }
</style>
</head>
<body>
<h1>安全标志图集 — 场景清单</h1>
<div class="sub" id="subtitle"></div>
<table id="table">
<thead><tr><th>序号</th><th>场景编号</th><th>场景名称</th><th>负责部门</th><th>位置描述</th><th>危险源标签</th><th>标志数量</th><th>安全标志</th></tr></thead>
<tbody id="tbody"></tbody>
</table>

<script>
var API=window.location.origin+'/api';
var tm={electric:'触电危险',fire:'火灾危险',chemical:'化学品危险',mechanical:'机械伤害',fall:'坠落危险',noise:'噪音危害',dust:'粉尘危害',radiation:'辐射危险',high_temp:'高温烫伤',low_temp:'低温冻伤',slippery:'滑倒危险',confined:'受限空间'};
var tc={electric:'#92400e',fire:'#dc2626',chemical:'#7c3aed',mechanical:'#ea580c',fall:'#059669',noise:'#b91c1c',dust:'#92400e',radiation:'#a21caf',high_temp:'#ea580c',low_temp:'#0891b2',slippery:'#ca8a04',confined:'#6d28d9'};

function loadCustomTags(){return fetch(API+'/custom-hazard-tags').then(function(r){return r.json();}).catch(function(){return[];});}

Promise.all([fetch(API+'/scenes').then(function(r){return r.json();}), loadCustomTags()]).then(function(results){
    var scenes=results[0];
    var customTags=results[1];
    var tagMap={};
    customTags.forEach(function(t){tagMap[t.tag_id]=t.tag_name;});

    var now=new Date();
    document.getElementById('subtitle').textContent='导出时间: '+now.getFullYear()+'/'+(now.getMonth()+1)+'/'+now.getDate()+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+' | 共 '+scenes.length+' 个场景';

    var html='';
    scenes.forEach(function(s,i){
        var signs=s.signs||[];
        // Hazard tags to Chinese
        var tags='';
        if(s.hazard_tags){
            tags=s.hazard_tags.split(',').filter(function(t){return t.trim();}).map(function(t){
                var tid=t.trim();
                var n=tm[tid]||tagMap[tid]||(tid.startsWith('custom_')?'已删除':tid);
                var c=tc[tid]||'#667eea';
                return '<span class=tag style=background:'+c+'20;color:'+c+';border:1px solid '+c+';>'+n+'</span>';
            }).join('');
        }

        // Sign thumbnails
        var thumbs='';
        if(signs.length>0){
            signs.forEach(function(sg){
                if(sg.image_url){
                    thumbs+='<img src="'+sg.image_url+'" onerror="this.outerHTML=\'<div class=no-img>无图</div>\'" alt="'+sg.sign_name+'">';
                }else{
                    thumbs+='<div class=no-img>无图</div>';
                }
            });
        }else{
            thumbs='<span style=color:#9ca3af;font-size:11px;>无</span>';
        }

        html+='<tr><td>'+(i+1)+'</td><td>'+s.scene_code+'</td><td><b>'+s.scene_name+'</b></td><td>'+s.department+'</td><td>'+(s.location_description||'')+'</td><td>'+(tags||'<span style=color:#9ca3af;>无</span>')+'</td><td style=text-align:center;>'+(signs.length||0)+'</td><td><div class=sign-thumbs>'+thumbs+'</div></td></tr>';
    });
    document.getElementById('tbody').innerHTML=html;
}).catch(function(e){document.body.innerHTML='<h3 style=color:#dc3545;>加载失败: '+e.message+'</h3>';});
</script>
</body>
</html>
